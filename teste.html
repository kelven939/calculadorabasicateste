<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha Calculadora</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
        background-color: green;
        color: white;
      }
      button {
        background-color: blue;
        color: white;
        cursor: pointer;
        outline: none;
        border: none;
        width: 125px;
        height: 55px;
        border-radius: 35px;
        font-size: 18px;
      }
      button:hover {
        background-color: red;
      }
      #boxcalculadora {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        border: 2px solid white;
        border-radius: 35px;
        width: 395px;
        height: 424px;
        gap: 25px;
      }
    </style>
  </head>
  <body>
    <div id="boxcalculadora">
      <h1>Calculadora</h1>
      <input id="numero1" type="number" />
      <input id="numero2" type="number" />
      <button id="somar" onclick="somarNumeros()">Somar</button>
      <p>Resultado: <span id="resultado">0</span></p>
    </div>

    <script>
      console.log("Hello, World!");

      let numero1 = document.getElementById("numero1");
      let numero2 = document.getElementById("numero2");
      let resultado = document.getElementById("resultado");
      let somar = document.getElementById("somar");

      function somarNumeros() {
        let num1 = parseFloat(numero1.value);
        let num2 = parseFloat(numero2.value);
        resultado.textContent = num1 + num2;
      }
    </script>
  </body>
</html>
